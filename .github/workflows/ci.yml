name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck version
        run: shellcheck --version
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
