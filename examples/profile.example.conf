# Example odoo-mirror profile. Copy it to ~/.config/odoo-mirror/profiles/<name>.conf
# (or create one with `odoo-mirror --save-profile NAME`).
# Only NON-SECRET settings belong here. Passwords are asked at run time.
REMOTE_HOST="myserver"                 # ssh host or alias from ~/.ssh/config
SSH_PORT="2323"                        # empty = from ssh config
SSH_USER=""
SSH_KEY=""                             # path to an identity file, optional
REMOTE_DB="mydb_staging"
REMOTE_FS_ROOT="/opt/odoo/.local/share/Odoo/filestore"   # parent of the DB folder; empty = auto-detect
USE_SUDO="1"                           # 0 when your user can run pg_dump / read the filestore
REMOTE_PG_OSUSER="postgres"
LOCAL_DB="mydb_staging_local"
OUT_DIR="~/odoo-mirror"
ODOO_BIN="~/odoo/odoo-bin"
ODOO_PYTHON="~/venv/bin/python3"
ODOO_CONF="~/odoo/odoo.conf"
ODOO_VERSION_TAG="19.0+e"
SANITIZE_SQL_FILE=""
NEUTRALIZE="1"
SANITIZE="1"
KEEP_BUILD="0"
